# ============================================================
# Nginx 配置 - Legal AI Advisor
# 路径：/etc/nginx/sites-available/legal-ai-advisor.conf
# 启用：ln -sf ../sites-available/legal-ai-advisor.conf /etc/nginx/sites-enabled/
# 检查：nginx -t && systemctl reload nginx
# ============================================================
#
# 1. 把 server_name 改成你的域名
# 2. 准备好 HTTPS 证书（用 acme.sh 申请，见 DEPLOY.md 第 5 节）
# 3. 证书路径占位符 /etc/nginx/ssl/legal-ai-advisor.* 见下方 ssl_certificate 段
# 4. 前端静态文件默认放 /var/www/legal-ai-advisor/dist/
#    修改方法：sudo mkdir -p /var/www/legal-ai-advisor
#             sudo cp -r frontend/dist/* /var/www/legal-ai-advisor/
# ============================================================

# --- HTTP：仅做 80→443 跳转 + ACME 验证 ---
server {
    listen 80;
    listen [::]:80;
    server_name your.domain.com;

    # acme.sh 申请证书时的验证目录
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    # 其他全部跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS：主站点 ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name your.domain.com;

    # ========== SSL 证书 ==========
    # 用 acme.sh 申请后默认放在 /etc/nginx/ssl/your.domain.com_nginx/
    # 如果用 certbot 默认在 /etc/letsencrypt/live/<domain>/
    ssl_certificate     /etc/nginx/ssl/your.domain.com_nginx/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/your.domain.com_nginx/your.domain.com.key;

    # 现代 TLS 配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 客户端最大上传（默认与后端 .env 的 MAX_UPLOAD_MB 保持一致或更大）
    client_max_body_size 60M;

    # 访问/错误日志
    access_log /var/log/nginx/legal-ai-advisor.access.log;
    error_log  /var/log/nginx/legal-ai-advisor.error.log warn;

    # ========== /api 反代到后端（uvicorn 8003） ==========
    location /api/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;

        # 传递真实客户端信息
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # SSE / 长连接支持（聊天流式响应必须）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout  600s;   # 10 分钟，SSE 流式问答需要
        proxy_send_timeout  600s;
        proxy_connect_timeout 60s;

        # 不要让 nginx 把 chunked 编码解开
        proxy_request_buffering off;
        chunked_transfer_encoding on;
    }

    # 健康检查直接放行（不走反代，方便外部监控）
    location = /healthz {
        proxy_pass http://127.0.0.1:8003/health;
        access_log off;
    }

    # ========== 前端静态资源 ==========
    # Vite build 产物
    root /var/www/legal-ai-advisor;
    index index.html;

    # 长缓存（带 hash 的资源）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 默认 / 单页应用 fallback（Vue Router history 模式必须）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 不让访问 .env / .git / 隐藏文件
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # favicon / robots / sitemap
    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; }
}
