# ============================================================
# Nginx 配置 - Legal AI Advisor（无域名 / 仅 HTTP + 公网 IP 访问版）
# 路径：/etc/nginx/sites-available/legal-ai-advisor.conf
# 启用：ln -sf /etc/nginx/sites-available/legal-ai-advisor.conf \
#             /etc/nginx/sites-enabled/legal-ai-advisor.conf
# 检查：nginx -t && systemctl reload nginx
# ============================================================
# 适用：还没有域名、或域名未完成 ICP 备案时的过渡方案。
# 以后有了域名要做 HTTPS，改用 legal-ai-advisor.conf 并跑 DEPLOY.md 第 5 节即可。
#
# 前端静态文件位置：/var/www/legal-ai-advisor/
#   sudo mkdir -p /var/www/legal-ai-advisor
#   sudo cp -r dist/* /var/www/legal-ai-advisor/
# ============================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;                 # 用 IP 直接访问，不校验 Host

    # 上传文件大小上限（与后端 .env 的 MAX_UPLOAD_MB=50 对齐，留 10M 余量）
    client_max_body_size 60M;

    access_log /var/log/nginx/legal-ai-advisor.access.log;
    error_log  /var/log/nginx/legal-ai-advisor.error.log warn;

    # ========== /api 反代到后端（uvicorn 8003） ==========
    location /api/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # SSE / 长连接支持（聊天流式响应必须）
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
        proxy_connect_timeout 60s;
    }

    # 健康检查（放行给外部监控）
    location = /healthz {
        proxy_pass http://127.0.0.1:8003/health;
        access_log off;
    }

    # ========== 前端静态资源 ==========
    root /var/www/legal-ai-advisor;
    index index.html;

    # 带 hash 的产物长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Vue Router history 模式 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 禁止访问隐藏文件（.git / .env 等）
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location = /favicon.ico { log_not_found off; access_log off; }

    # 基础安全头（非 HTTPS 场景不加 HSTS，避免后续切 IP→域名时被锁死）
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
}
